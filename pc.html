<!DOCTYPE html>
<html class="dark" lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta content="width=device-width, initial-scale=1.0" name="viewport" />
		<title data-i18n="pc.pageTitle"></title>
		<script src="https://cdn.tailwindcss.com"></script>
		<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
	</head>
	<body class="min-h-screen bg-zinc-950 text-zinc-100 flex flex-col selection:bg-amber-500 selection:text-zinc-950">

		<!-- Toast Notification Banner -->
		<div class="hidden fixed top-4 right-4 left-4 sm:left-auto sm:max-w-md z-50 px-4 py-3 rounded-xl border border-amber-500/40 bg-zinc-900/95 text-amber-300 shadow-2xl text-sm font-medium" data-role="notification-banner"></div>

		<!-- Top Navbar Responsive -->
		<header class="border-b border-zinc-800 bg-zinc-900/90 backdrop-blur sticky top-0 z-30">
			<div class="max-w-7xl mx-auto px-3 sm:px-4 py-2.5 flex flex-wrap items-center justify-between gap-2">
				<!-- Left: Hub + Character Selector + New + Import XML + Save to Drive -->
				<div class="flex flex-wrap items-center gap-2 w-full sm:w-auto">
					<a class="px-2.5 py-1.5 rounded-lg bg-zinc-800 hover:bg-zinc-700 text-xs font-medium text-zinc-300" data-i18n="common.hubBtn" href="./index.html"></a>
					<select
						class="flex-1 sm:flex-initial bg-zinc-950 border border-zinc-700 rounded-lg px-3 py-1.5 text-sm font-semibold text-amber-400 focus:outline-none focus:border-amber-500"
						data-action="changeActiveCharacter"
						data-role="character-selector"></select>
					<button class="px-2.5 py-1.5 rounded-lg bg-zinc-800 hover:bg-zinc-700 text-xs font-medium text-zinc-200" data-action="newCharacter" data-i18n="pc.newPcBtn" type="button"></button>
					<button class="px-2.5 py-1.5 rounded-lg bg-amber-500/15 hover:bg-amber-500/25 border border-amber-500/30 text-xs font-medium text-amber-300" data-action="triggerImportXml" data-i18n="pc.importXmlBtn" type="button"></button>
					<input accept=".xml" class="hidden" data-action="handleImportXmlFile" id="input-import-xml" type="file" />

					<!-- Visible ONLY when logged into Google Drive -->
					<button class="hidden px-3 py-1.5 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-xs font-bold text-white shadow" data-action="saveCharacterExplicit" data-i18n="pc.saveDriveBtn" data-role="auth-logged-in" type="button"></button>
					<span class="hidden text-[11px] text-zinc-400" data-field="saveStatusText" data-role="auth-logged-in"></span>
				</div>

				<!-- Right: DB Status + Language Selector + User Avatar Dropdown -->
				<div class="flex items-center gap-2.5 w-full sm:w-auto justify-end">
					<div class="flex items-center gap-2 bg-zinc-950 border border-zinc-800 px-2.5 py-1.5 rounded-lg text-xs" data-role="db-status-widget">
						<span class="w-2 h-2 rounded-full bg-emerald-400 hidden" data-show-if="isDbReady"></span>
						<span class="w-2 h-2 rounded-full bg-amber-400 animate-pulse hidden" data-show-if="isDownloadingDb"></span>
						<span class="w-2 h-2 rounded-full bg-rose-500 hidden" data-show-if="isDbError"></span>
						<span class="text-zinc-300 font-medium truncate max-w-[140px] sm:max-w-none" data-field="dbStatusText"></span>
						<div class="w-12 h-1.5 bg-zinc-800 rounded-full overflow-hidden hidden" data-show-if="isDownloadingDb">
							<div class="h-full bg-amber-400 transition-all duration-200" data-role="db-progress-bar" style="width: 0%"></div>
						</div>
					</div>

					<select
						aria-label="Language"
						class="bg-zinc-950 border border-zinc-800 hover:border-zinc-700 rounded-lg px-2.5 py-1.5 text-xs font-semibold text-zinc-200 cursor-pointer focus:outline-none focus:border-amber-500"
						data-action="switchLanguage">
						<option value="eng">🇬🇧</option>
						<option value="ita">🇮🇹</option>
					</select>

					<!-- User Avatar / Generic Silhouette with Dropdown -->
					<div class="relative" data-role="user-menu-container">
						<button aria-label="Account" class="relative flex items-center justify-center w-9 h-9 rounded-full bg-zinc-950 border border-zinc-700 hover:border-amber-500/60 focus:outline-none transition" data-action="toggleUserMenu" type="button">
							<img alt="" class="hidden w-full h-full rounded-full object-cover" data-role="user-avatar-img" referrerpolicy="no-referrer" />
							<span class="flex items-center justify-center text-zinc-400" data-role="user-avatar-fallback">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" />
                <circle cx="12" cy="7" r="4" />
              </svg>
            </span>
							<span class="absolute -bottom-0.5 -right-0.5 w-2.5 h-2.5 rounded-full bg-zinc-500 ring-2 ring-zinc-900" data-role="user-status-dot"></span>
						</button>

						<div class="hidden absolute right-0 mt-2 w-64 rounded-2xl border border-zinc-800 bg-zinc-900/95 backdrop-blur-md shadow-2xl p-3.5 z-50" data-role="user-menu-dropdown">
							<div class="space-y-3" data-role="auth-logged-out">
								<div>
									<div class="text-xs font-bold text-zinc-200" data-i18n="common.guestTitle"></div>
									<p class="text-[11px] text-zinc-400 mt-0.5 leading-relaxed" data-i18n="common.notConnectedDesc"></p>
								</div>
								<button class="w-full py-2 px-3 rounded-xl bg-sky-600 hover:bg-sky-500 text-xs font-bold text-white shadow transition" data-action="loginGoogle" data-i18n="common.loginGoogle" type="button"></button>
							</div>

							<div class="hidden space-y-3" data-role="auth-logged-in">
								<div class="border-b border-zinc-800 pb-2.5">
									<div class="text-xs font-bold text-white truncate" data-field="userName"></div>
									<div class="text-[11px] text-emerald-400 truncate" data-field="userEmail"></div>
									<div class="text-[10px] text-zinc-500 mt-1">
										<span data-i18n="common.vaultFolder"></span> <code>DND5E_Vault</code>
									</div>
								</div>
								<button
									class="w-full py-1.5 px-3 rounded-xl bg-zinc-800 hover:bg-rose-950/60 hover:text-rose-300 border border-zinc-700/80 text-xs font-semibold text-zinc-200 transition"
									data-action="logoutGoogle"
									data-i18n="common.logout"
									type="button"></button>
							</div>
						</div>
					</div>
				</div>
			</div>

			<!-- Second Bar: Campaign Link & Live Session Control -->
			<div class="bg-zinc-950/90 border-t border-zinc-800/80 px-3 sm:px-4 py-2" data-role="campaign-session-bar">
				<div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-2 text-xs">

					<!-- STATE A: No Campaign Linked -->
					<div class="flex flex-wrap items-center justify-between w-full gap-2" data-show-if="hasNoCampaign">
						<span class="text-zinc-400" data-i18n="pc.garageHint"></span>
						<button class="hidden px-3 py-1 rounded-md bg-indigo-600 hover:bg-indigo-500 text-white font-semibold" data-action="linkToCampaignPicker" data-i18n="pc.linkCampaignBtn" data-role="auth-logged-in" type="button"></button>
					</div>

					<!-- STATE B: Campaign Linked -> Session Status Indicator & Join/Leave Buttons -->
					<div class="hidden flex flex-wrap items-center justify-between w-full gap-3" data-show-if="hasCampaign">
						<div class="flex flex-wrap items-center gap-2">
            <span class="px-2.5 py-1 rounded-md bg-indigo-500/15 border border-indigo-500/30 text-indigo-300 font-semibold">
              <span data-i18n="pc.campaignLabel"></span> <strong class="text-white" data-field="linkedCampaignName"></strong>
            </span>
							<button class="hidden px-2 py-1 rounded bg-zinc-800 hover:bg-zinc-700 text-zinc-300 text-[11px]" data-action="linkToCampaignPicker" data-i18n="pc.changeCampaignBtn" data-role="auth-logged-in" type="button"></button>
							<button class="px-2 py-1 rounded bg-zinc-900 hover:bg-rose-950/50 text-rose-400 text-[11px]" data-action="unlinkFromCampaign" data-i18n="pc.unlinkCampaignBtn" type="button"></button>
						</div>

						<div class="flex flex-wrap items-center gap-2.5">
							<div class="flex items-center gap-2 px-3 py-1 rounded-lg bg-zinc-900 border border-zinc-800">
								<span class="w-2.5 h-2.5 rounded-full bg-rose-500" data-show-if="isSessionOffline"></span>
								<span class="hidden w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse" data-show-if="isSessionReadyToJoin"></span>
								<span class="hidden w-2.5 h-2.5 rounded-full bg-amber-400 animate-ping" data-show-if="isSessionConnecting"></span>
								<span class="hidden w-2.5 h-2.5 rounded-full bg-sky-400" data-show-if="isSessionConnected"></span>
								<span class="font-medium text-zinc-200" data-field="sessionStatusText"></span>
								<button class="text-zinc-400 hover:text-white ml-1" data-action="checkSessionNow" data-i18n-title="pc.refreshSessionTitle" data-show-if="canJoinSession" type="button">
									&#8635;
								</button>
							</div>

							<button
								class="px-3.5 py-1 rounded-md bg-emerald-600 hover:bg-emerald-500 text-white font-bold shadow"
								data-action="connectP2P"
								data-enable-if="isMasterSessionAvailable"
								data-i18n="pc.joinSessionBtn"
								data-show-if="canJoinSession"
								type="button"></button>
							<button class="hidden px-3.5 py-1 rounded-md bg-rose-600 hover:bg-rose-500 text-white font-bold shadow" data-action="disconnectP2P" data-i18n="pc.leaveSessionBtn" data-show-if="isSessionConnected" type="button"></button>
						</div>
					</div>

				</div>
			</div>
		</header>

		<!-- Main Character Sheet Container (12-Column Responsive Grid) -->
		<main class="max-w-7xl w-full mx-auto px-3 sm:px-4 py-4 flex-1 grid grid-cols-1 lg:grid-cols-12 gap-4 lg:gap-6" data-role="pc-sheet-root">

			<!-- LEFT + CENTER COLUMN (Character Sheet: 8 cols on Desktop) -->
			<section class="lg:col-span-8 flex flex-col gap-4">

				<!-- Character Identity + Portrait Card -->
				<div class="rounded-2xl border border-zinc-800 bg-zinc-900/70 p-4 space-y-3">
					<div class="flex flex-wrap items-center justify-between gap-2">
						<span class="px-2.5 py-0.5 rounded-full text-xs font-semibold bg-amber-500/10 text-amber-400 border border-amber-500/20" data-field="campaignBadgeText"></span>
						<div class="flex flex-wrap items-center gap-3 text-xs">
							<label class="inline-flex items-center gap-1.5 cursor-pointer text-zinc-300">
								<input class="rounded bg-zinc-950 border-zinc-700 text-amber-500" data-action="updateBasicField" data-field="inspiration" type="checkbox" />
								<span data-i18n="pc.inspiration"></span>
							</label>
							<span class="px-2 py-0.5 rounded bg-zinc-800 text-zinc-300">
              <span data-i18n="pc.acLabel"></span> <strong class="text-sky-400" data-field="ac">10</strong>
            </span>
							<span class="px-2 py-0.5 rounded bg-zinc-800 text-zinc-300">
              <span data-i18n="pc.profBonusLabel"></span> <strong class="text-amber-400" data-field="proficiencyBonus">+2</strong>
            </span>
							<span class="px-2 py-0.5 rounded bg-zinc-800 text-zinc-400">
              <span data-i18n="pc.hdLabel"></span> <strong class="text-zinc-200" data-field="hitDiceSummary">1d8</strong>
            </span>
						</div>
					</div>

					<div class="flex flex-col sm:flex-row gap-4 items-center sm:items-start">
						<img alt="" class="hidden w-20 h-20 sm:w-24 sm:h-24 rounded-2xl object-cover border-2 border-amber-500/40 shadow-lg shrink-0" data-field="portraitUrl" data-show-if="hasPortrait" />

						<div class="grid grid-cols-1 sm:grid-cols-6 gap-2.5 flex-1 w-full">
							<div class="sm:col-span-3">
								<label class="block text-[11px] uppercase tracking-wider text-zinc-400" data-i18n="pc.charNameLabel"></label>
								<input class="w-full bg-zinc-950 border border-zinc-800 rounded-lg px-3 py-1.5 text-base font-bold text-white" data-action="updateBasicField" data-field="name" type="text" />
							</div>
							<div class="sm:col-span-1">
								<label class="block text-[11px] uppercase tracking-wider text-zinc-400" data-i18n="pc.totalLevelLabel"></label>
								<input
									class="w-full bg-zinc-950 border border-zinc-800 rounded-lg px-2.5 py-1.5 text-base font-bold text-amber-400 text-center"
									data-action="updateBasicField"
									data-enable-if="canLevelUp"
									data-field="level"
									max="20"
									min="1"
									type="number" />
							</div>
							<div class="sm:col-span-2">
								<label class="block text-[11px] uppercase tracking-wider text-zinc-400" data-i18n="pc.classesLabel"></label>
								<input class="w-full bg-zinc-950 border border-zinc-800 rounded-lg px-3 py-1.5 text-sm font-semibold text-amber-300" data-action="updateBasicField" data-field="classesRaw" type="text" />
							</div>
							<div class="sm:col-span-2">
								<label class="block text-[11px] uppercase tracking-wider text-zinc-400" data-i18n="pc.raceLabel"></label>
								<input class="w-full bg-zinc-950 border border-zinc-800 rounded-lg px-3 py-1.5 text-sm text-zinc-200" data-action="updateBasicField" data-field="race" type="text" />
							</div>
							<div class="sm:col-span-2">
								<label class="block text-[11px] uppercase tracking-wider text-zinc-400" data-i18n="pc.backgroundLabel"></label>
								<input class="w-full bg-zinc-950 border border-zinc-800 rounded-lg px-3 py-1.5 text-sm text-zinc-200" data-action="updateBasicField" data-field="background" type="text" />
							</div>
							<div class="sm:col-span-2">
								<label class="block text-[11px] uppercase tracking-wider text-zinc-400" data-i18n="pc.alignmentLabel"></label>
								<input class="w-full bg-zinc-950 border border-zinc-800 rounded-lg px-3 py-1.5 text-sm text-zinc-200" data-action="updateBasicField" data-field="alignment" type="text" />
							</div>
						</div>
					</div>
				</div>

				<!-- 6 Abilities + Saving Throws Responsive Grid -->
				<div class="grid grid-cols-2 sm:grid-cols-3 xl:grid-cols-6 gap-2.5" data-list="abilities"></div>

				<!-- Hit Points & Wealth Bar -->
				<div class="grid grid-cols-1 md:grid-cols-2 gap-3">
					<div class="rounded-2xl border border-zinc-800 bg-zinc-900/70 p-3.5">
						<h3 class="text-xs font-bold uppercase tracking-wider text-rose-400 mb-2" data-i18n="pc.hpTitle"></h3>
						<div class="grid grid-cols-3 gap-2">
							<div>
								<label class="block text-[11px] text-zinc-400" data-i18n="pc.hpCurrent"></label>
								<input class="w-full bg-zinc-950 border border-zinc-800 rounded-lg px-2 py-1.5 text-center text-lg font-extrabold text-emerald-400" data-action="updateBasicField" data-field="hp.current" type="number" />
							</div>
							<div>
								<label class="block text-[11px] text-zinc-400" data-i18n="pc.hpMax"></label>
								<input class="w-full bg-zinc-950 border border-zinc-800 rounded-lg px-2 py-1.5 text-center text-lg font-bold text-zinc-200" data-action="updateBasicField" data-field="hp.max" type="number" />
							</div>
							<div>
								<label class="block text-[11px] text-zinc-400" data-i18n="pc.hpTemp"></label>
								<input class="w-full bg-zinc-950 border border-zinc-800 rounded-lg px-2 py-1.5 text-center text-lg font-bold text-sky-400" data-action="updateBasicField" data-field="hp.temp" type="number" />
							</div>
						</div>
					</div>

					<div class="rounded-2xl border border-zinc-800 bg-zinc-900/70 p-3.5">
						<div class="flex items-center justify-between mb-2">
							<h3 class="text-xs font-bold uppercase tracking-wider text-amber-400" data-i18n="pc.wealthTitle"></h3>
							<span class="text-[11px] text-zinc-500" data-hide-if="canEditMoneyManually" data-i18n="pc.lockedByGm"></span>
						</div>
						<div class="grid grid-cols-5 gap-1.5">
							<div>
								<label class="block text-[10px] text-center text-zinc-400">PP</label>
								<input class="w-full bg-zinc-950 border border-zinc-800 rounded-lg px-1 py-1.5 text-center text-sm font-bold text-zinc-200" data-action="updateBasicField" data-enable-if="canEditMoneyManually" data-field="money.pp" type="number" />
							</div>
							<div>
								<label class="block text-[10px] text-center text-amber-400">GP</label>
								<input class="w-full bg-zinc-950 border border-zinc-800 rounded-lg px-1 py-1.5 text-center text-sm font-bold text-amber-400" data-action="updateBasicField" data-enable-if="canEditMoneyManually" data-field="money.gp" type="number" />
							</div>
							<div>
								<label class="block text-[10px] text-center text-zinc-400">EP</label>
								<input class="w-full bg-zinc-950 border border-zinc-800 rounded-lg px-1 py-1.5 text-center text-sm font-bold text-zinc-200" data-action="updateBasicField" data-enable-if="canEditMoneyManually" data-field="money.ep" type="number" />
							</div>
							<div>
								<label class="block text-[10px] text-center text-zinc-300">SP</label>
								<input class="w-full bg-zinc-950 border border-zinc-800 rounded-lg px-1 py-1.5 text-center text-sm font-bold text-zinc-300" data-action="updateBasicField" data-enable-if="canEditMoneyManually" data-field="money.sp" type="number" />
							</div>
							<div>
								<label class="block text-[10px] text-center text-orange-400">CP</label>
								<input class="w-full bg-zinc-950 border border-zinc-800 rounded-lg px-1 py-1.5 text-center text-sm font-bold text-orange-400" data-action="updateBasicField" data-enable-if="canEditMoneyManually" data-field="money.cp" type="number" />
							</div>
						</div>
					</div>
				</div>

				<!-- Quick Attacks & Resources / Trackers -->
				<div class="grid grid-cols-1 md:grid-cols-2 gap-3">
					<div class="rounded-2xl border border-zinc-800 bg-zinc-900/70 p-3.5 space-y-2">
						<h3 class="text-xs font-bold uppercase tracking-wider text-amber-400" data-i18n="pc.attacksTitle"></h3>
						<p class="text-xs text-zinc-500" data-empty="attacks" data-i18n="pc.emptyAttacks"></p>
						<div class="space-y-1.5" data-list="attacks"></div>
					</div>
					<div class="rounded-2xl border border-zinc-800 bg-zinc-900/70 p-3.5 space-y-2">
						<h3 class="text-xs font-bold uppercase tracking-wider text-indigo-400" data-i18n="pc.trackersTitle"></h3>
						<p class="text-xs text-zinc-500" data-empty="trackers" data-i18n="pc.emptyTrackers"></p>
						<div class="grid grid-cols-1 sm:grid-cols-2 gap-2" data-list="trackers"></div>
					</div>
				</div>

				<!-- Horizontal Scrollable Tab Bar -->
				<nav class="flex items-center gap-1.5 overflow-x-auto pb-1 border-b border-zinc-800">
					<button class="px-3.5 py-2 rounded-t-xl bg-zinc-900 hover:bg-zinc-800 text-xs font-semibold text-zinc-200 whitespace-nowrap" data-action="switchTab" data-i18n="pc.tabSkills" data-tab-target="skills" type="button"></button>
					<button class="px-3.5 py-2 rounded-t-xl bg-zinc-900 hover:bg-zinc-800 text-xs font-semibold text-zinc-200 whitespace-nowrap" data-action="switchTab" data-i18n="pc.tabSpells" data-tab-target="spells" type="button"></button>
					<button class="px-3.5 py-2 rounded-t-xl bg-zinc-900 hover:bg-zinc-800 text-xs font-semibold text-zinc-200 whitespace-nowrap" data-action="switchTab" data-i18n="pc.tabItems" data-tab-target="items" type="button"></button>
					<button class="px-3.5 py-2 rounded-t-xl bg-zinc-900 hover:bg-zinc-800 text-xs font-semibold text-zinc-200 whitespace-nowrap" data-action="switchTab" data-i18n="pc.tabFeats" data-tab-target="feats" type="button"></button>
					<button class="px-3.5 py-2 rounded-t-xl bg-emerald-500/10 hover:bg-emerald-500/20 text-xs font-semibold text-emerald-300 whitespace-nowrap" data-action="switchTab" data-tab-target="companions" type="button">
						<span data-i18n="pc.tabCompanions"></span> (<span data-field="companionsCount">0</span>)
					</button>
					<button class="px-3.5 py-2 rounded-t-xl bg-amber-500/10 hover:bg-amber-500/20 text-xs font-semibold text-amber-300 whitespace-nowrap" data-action="switchTab" data-i18n="pc.tabShop" data-tab-target="shop" type="button"></button>
					<button
						class="px-3.5 py-2 rounded-t-xl bg-indigo-500/10 hover:bg-indigo-500/20 text-xs font-semibold text-indigo-300 whitespace-nowrap"
						data-action="switchTab"
						data-i18n="pc.tabCompendium"
						data-tab-target="compendium"
						type="button"></button>
					<button class="px-3.5 py-2 rounded-t-xl bg-zinc-900 hover:bg-zinc-800 text-xs font-semibold text-zinc-200 whitespace-nowrap" data-action="switchTab" data-i18n="pc.tabNotes" data-tab-target="notes" type="button"></button>
				</nav>

				<!-- PANEL 1: SKILLS -->
				<div class="rounded-2xl border border-zinc-800 bg-zinc-900/60 p-4" data-tab-panel="skills">
					<h3 class="text-sm font-bold text-zinc-200 mb-3" data-i18n="pc.skillsHeader"></h3>
					<div class="grid grid-cols-1 sm:grid-cols-2 gap-2" data-list="skills"></div>
				</div>

				<!-- PANEL 2: SPELLS + SLOTS -->
				<div class="hidden rounded-2xl border border-zinc-800 bg-zinc-900/60 p-4 space-y-3" data-tab-panel="spells">
					<div class="flex flex-wrap items-center justify-between gap-2">
						<h3 class="text-sm font-bold text-zinc-200" data-i18n="pc.spellsHeader"></h3>
						<div class="flex flex-wrap gap-2" data-list="spell-slots"></div>
					</div>
					<p class="text-xs text-zinc-500 py-4 text-center" data-empty="spells" data-i18n="pc.emptySpells"></p>
					<div class="space-y-2.5" data-list="spells"></div>
				</div>

				<!-- PANEL 3: INVENTORY -->
				<div class="hidden rounded-2xl border border-zinc-800 bg-zinc-900/60 p-4 space-y-3" data-tab-panel="items">
					<h3 class="text-sm font-bold text-zinc-200" data-i18n="pc.itemsHeader"></h3>
					<p class="text-xs text-zinc-500 py-4 text-center" data-empty="items" data-i18n="pc.emptyItems"></p>
					<div class="space-y-2.5" data-list="items"></div>
				</div>

				<!-- PANEL 4: FEATS & FEATURES -->
				<div class="hidden rounded-2xl border border-zinc-800 bg-zinc-900/60 p-4 space-y-3" data-tab-panel="feats">
					<h3 class="text-sm font-bold text-zinc-200" data-i18n="pc.featsHeader"></h3>
					<p class="text-xs text-zinc-500 py-4 text-center" data-empty="feats" data-i18n="pc.emptyFeats"></p>
					<div class="space-y-2.5" data-list="feats"></div>
				</div>

				<!-- PANEL 5: COMPANIONS (<monster>, e.g., A.R.G.O.) -->
				<div class="hidden rounded-2xl border border-zinc-800 bg-zinc-900/60 p-4 space-y-3" data-tab-panel="companions">
					<h3 class="text-sm font-bold text-emerald-400" data-i18n="pc.companionsHeader"></h3>
					<p class="text-xs text-zinc-500 py-4 text-center" data-empty="companions" data-i18n="pc.emptyCompanions"></p>
					<div class="space-y-4" data-list="companions"></div>
				</div>

				<!-- PANEL 6: CAMPAIGN SHOP -->
				<div class="hidden rounded-2xl border border-zinc-800 bg-zinc-900/60 p-4 space-y-3" data-tab-panel="shop">
					<div class="flex flex-wrap items-center justify-between gap-2">
						<h3 class="text-sm font-bold text-amber-400" data-i18n="pc.shopHeader"></h3>
						<span class="text-xs text-zinc-400" data-i18n="pc.shopSubtitle"></span>
					</div>
					<p class="text-xs text-zinc-500 py-4 text-center" data-empty="campaign-shop" data-i18n="pc.emptyShop"></p>
					<div class="grid grid-cols-1 sm:grid-cols-2 gap-3" data-list="campaign-shop"></div>
				</div>

				<!-- PANEL 7: SQLITE COMPENDIUM SEARCH -->
				<div class="hidden rounded-2xl border border-zinc-800 bg-zinc-900/60 p-4 space-y-3" data-tab-panel="compendium">
					<div class="flex flex-col sm:flex-row gap-2">
						<select class="bg-zinc-950 border border-zinc-800 rounded-lg px-3 py-2 text-xs text-zinc-200" data-field="compendiumCategory">
							<option data-i18n="pc.catAll" value=""></option>
							<option data-i18n="pc.catSpells" value="spells"></option>
							<option data-i18n="pc.catItems" value="items"></option>
							<option data-i18n="pc.catFeats" value="feats"></option>
							<option data-i18n="pc.catMonsters" value="monsters"></option>
							<option data-i18n="pc.catConditions" value="conditions"></option>
						</select>
						<input class="flex-1 bg-zinc-950 border border-zinc-800 rounded-lg px-3 py-2 text-xs text-white" data-action="searchCompendiumInput" data-event="input" data-i18n-placeholder="pc.searchPlaceholder" type="search" />
					</div>
					<div class="space-y-2 max-h-96 overflow-y-auto pr-1" data-list="compendium-results"></div>
				</div>

				<!-- PANEL 8: JOURNAL & NOTES -->
				<div class="hidden rounded-2xl border border-zinc-800 bg-zinc-900/60 p-4 space-y-2" data-tab-panel="notes">
					<h3 class="text-sm font-bold text-zinc-200" data-i18n="pc.notesHeader"></h3>
					<textarea class="w-full bg-zinc-950 border border-zinc-800 rounded-xl p-3 text-sm text-zinc-200 leading-relaxed" data-action="updateBasicField" data-field="notes" data-i18n-placeholder="pc.notesPlaceholder" rows="14"></textarea>
				</div>

			</section>

			<!-- RIGHT COLUMN (Dice Roller Console & P2P Live Log: 4 cols on Desktop) -->
			<aside class="lg:col-span-4 flex flex-col gap-4">
				<div class="rounded-2xl border border-zinc-800 bg-zinc-900/70 p-4 space-y-3 sticky top-28">
					<div class="flex items-center justify-between">
						<h3 class="text-xs font-bold uppercase tracking-wider text-amber-400" data-i18n="pc.diceConsoleTitle"></h3>
						<div class="inline-flex rounded-lg border border-zinc-800 bg-zinc-950 p-0.5 text-[11px]">
							<button class="px-2 py-1 rounded-md hover:bg-rose-500/20 text-rose-300" data-action="setRollAdvantage" data-adv="-1" data-i18n="common.disShort" type="button"></button>
							<button class="px-2 py-1 rounded-md bg-zinc-800 text-zinc-200" data-action="setRollAdvantage" data-adv="0" data-i18n="common.normShort" type="button"></button>
							<button class="px-2 py-1 rounded-md hover:bg-emerald-500/20 text-emerald-300" data-action="setRollAdvantage" data-adv="1" data-i18n="common.advShort" type="button"></button>
						</div>
					</div>

					<div class="grid grid-cols-4 sm:grid-cols-7 lg:grid-cols-4 gap-1.5">
						<button class="py-2 rounded-lg bg-zinc-950 hover:bg-zinc-800 border border-zinc-800 text-xs font-bold" data-action="quickRollDie" data-die="1d4" type="button">d4</button>
						<button class="py-2 rounded-lg bg-zinc-950 hover:bg-zinc-800 border border-zinc-800 text-xs font-bold" data-action="quickRollDie" data-die="1d6" type="button">d6</button>
						<button class="py-2 rounded-lg bg-zinc-950 hover:bg-zinc-800 border border-zinc-800 text-xs font-bold" data-action="quickRollDie" data-die="1d8" type="button">d8</button>
						<button class="py-2 rounded-lg bg-zinc-950 hover:bg-zinc-800 border border-zinc-800 text-xs font-bold" data-action="quickRollDie" data-die="1d10" type="button">d10</button>
						<button class="py-2 rounded-lg bg-zinc-950 hover:bg-zinc-800 border border-zinc-800 text-xs font-bold" data-action="quickRollDie" data-die="1d12" type="button">d12</button>
						<button class="py-2 rounded-lg bg-amber-500/20 hover:bg-amber-500/30 border border-amber-500/40 text-amber-300 text-xs font-extrabold" data-action="quickRollDie" data-die="1d20" type="button">d20</button>
						<button class="py-2 rounded-lg bg-zinc-950 hover:bg-zinc-800 border border-zinc-800 text-xs font-bold" data-action="quickRollDie" data-die="1d100" type="button">d100</button>
					</div>

					<div class="flex gap-1.5">
						<input class="flex-1 bg-zinc-950 border border-zinc-800 rounded-lg px-3 py-1.5 text-xs text-zinc-200" data-field="customDiceFormula" data-i18n-placeholder="pc.customFormulaPlaceholder" type="text" />
						<button class="px-3 py-1.5 rounded-lg bg-amber-500 hover:bg-amber-400 text-zinc-950 text-xs font-bold" data-action="rollCustomFormula" data-i18n="common.Roll" type="button"></button>
					</div>

					<div class="border-t border-zinc-800 pt-3">
						<h4 class="text-[11px] font-semibold uppercase tracking-wider text-zinc-400 mb-2" data-i18n="pc.partyDiceLogTitle"></h4>
						<div class="space-y-2 max-h-80 overflow-y-auto pr-1" data-list="dice-log"></div>
					</div>
				</div>
			</aside>
		</main>

		<!-- ===================================================================== -->
		<!-- NATIVE <template> TAGS                                                -->
		<!-- ===================================================================== -->

		<template id="tpl-ability-card">
			<div class="rounded-xl border border-zinc-800 bg-zinc-900/80 p-2.5 flex flex-col items-center justify-between text-center gap-1">
				<span class="text-[11px] uppercase tracking-wider text-zinc-400 font-semibold" data-field="abilityLabel"></span>
				<button class="px-3 py-0.5 rounded-lg bg-zinc-950 hover:bg-amber-500/20 border border-zinc-800 hover:border-amber-500/40 text-lg font-extrabold text-amber-400 transition" data-action="rollAbilityCheck" type="button">
					<span data-field="modifier"></span>
				</button>
				<input class="w-14 bg-zinc-950 border border-zinc-800 rounded-md py-0.5 text-center text-xs font-bold text-zinc-200" data-action="updateAbilityScore" data-enable-if="canEditAbilities" data-field="score" max="30" min="1" type="number" />
				<button class="text-[10px] px-2 py-0.5 rounded bg-zinc-950 hover:bg-zinc-800 text-zinc-300 border border-zinc-800" data-action="rollSavingThrow" data-field="saveBonus" type="button"></button>
			</div>
		</template>

		<template id="tpl-attack-row">
			<div class="rounded-xl border border-zinc-800 bg-zinc-950/80 px-3 py-2 flex items-center justify-between gap-2 text-xs">
				<div>
					<span class="font-bold text-white" data-field="name"></span>
				</div>
				<div class="flex items-center gap-1.5">
					<button class="px-2 py-1 rounded bg-amber-500/20 hover:bg-amber-500/30 border border-amber-500/30 text-amber-300 font-bold" data-action="rollAttackHit" type="button">
						<span data-i18n="pc.hitBtn"></span> <span data-field="hitBonus"></span>
					</button>
					<button class="px-2 py-1 rounded bg-rose-500/20 hover:bg-rose-500/30 border border-rose-500/30 text-rose-300 font-semibold" data-action="rollAttackDamage" data-field="damageText" type="button"></button>
				</div>
			</div>
		</template>

		<template id="tpl-tracker-card">
			<div class="rounded-xl border border-zinc-800 bg-zinc-950/80 p-2.5 flex items-center justify-between gap-2 text-xs">
				<div>
					<div class="font-bold text-zinc-200" data-field="label"></div>
					<div class="text-[10px] text-zinc-500"><span data-field="origin"></span> &bull; <span data-field="resetLabel"></span></div>
				</div>
				<div class="flex items-center gap-1">
					<input class="w-12 bg-zinc-900 border border-zinc-700 rounded px-1 py-0.5 text-center font-bold text-indigo-300" data-action="updateTrackerValue" data-field="current" type="number" />
					<span class="text-zinc-500">/</span>
					<span class="font-bold text-zinc-400" data-field="max"></span>
				</div>
			</div>
		</template>

		<template id="tpl-spell-slot-badge">
			<div class="rounded-lg border border-indigo-500/30 bg-indigo-950/30 px-2.5 py-1 flex items-center gap-1.5 text-xs">
				<span class="font-semibold text-indigo-300" data-field="slotTitle"></span>
				<input class="w-10 bg-zinc-950 border border-zinc-700 rounded px-1 py-0.5 text-center font-bold text-white" data-action="updateSpellSlotCurrent" data-field="current" min="0" type="number" />
				<span class="text-zinc-400">/ <span data-field="max"></span></span>
			</div>
		</template>

		<template id="tpl-skill-row">
			<button class="w-full flex items-center justify-between px-3 py-2 rounded-xl bg-zinc-950/70 hover:bg-zinc-800/80 border border-zinc-800/80 text-xs transition" data-action="rollSkillCheck" type="button">
				<div class="flex items-center gap-2">
					<span class="text-amber-400 font-bold" data-field="proficientMarker"></span>
					<span class="font-medium text-zinc-200" data-field="skillName"></span>
					<span class="text-[10px] text-zinc-500 uppercase" data-field="abilityTag"></span>
				</div>
				<span class="font-bold text-amber-400" data-field="bonus"></span>
			</button>
		</template>

		<template id="tpl-spell-row">
			<div class="rounded-xl border border-zinc-800 bg-zinc-950/60 p-3 space-y-1.5">
				<div class="flex flex-wrap items-center justify-between gap-2">
					<div class="flex flex-wrap items-center gap-2">
						<input class="rounded bg-zinc-900 border-zinc-700 text-amber-500" data-action="toggleSpellPrepared" data-field="prepared" data-i18n-title="pc.preparedTitle" type="checkbox" />
						<span class="font-bold text-sm text-white" data-field="name"></span>
						<span class="px-2 py-0.5 rounded bg-indigo-500/20 text-indigo-300 text-[11px] font-semibold" data-field="levelLabel"></span>
						<span class="px-2 py-0.5 rounded bg-zinc-800 text-amber-300 text-[10px]" data-field="originBadge"></span>
						<span class="px-1.5 py-0.5 rounded bg-zinc-900 text-zinc-500 text-[10px]" data-field="sourceBadge"></span>
					</div>
					<div class="flex items-center gap-2">
						<button class="hidden px-2 py-0.5 rounded bg-amber-500/20 hover:bg-amber-500/30 text-amber-300 text-xs font-bold" data-action="rollSpellEffect" data-show-if="hasSpellRoll" type="button">
							🎲 <span data-field="rollFormula"></span>
						</button>
						<button class="text-xs text-rose-400 hover:underline" data-action="removeListItem" data-i18n="common.remove" data-list-type="spells" type="button"></button>
					</div>
				</div>
				<div class="flex flex-wrap gap-3 text-[11px] text-zinc-400">
					<span><span data-i18n="pc.castTimeLabel"></span> <strong class="text-zinc-300" data-field="castingTime"></strong></span>
					<span><span data-i18n="pc.rangeLabel"></span> <strong class="text-zinc-300" data-field="range"></strong></span>
					<span><span data-i18n="pc.durationLabel"></span> <strong class="text-zinc-300" data-field="duration"></strong></span>
				</div>
				<p class="text-xs text-zinc-300 leading-relaxed whitespace-pre-line" data-field="description"></p>
			</div>
		</template>

		<template id="tpl-item-row">
			<div class="rounded-xl border border-zinc-800 bg-zinc-950/60 p-3 space-y-1.5">
				<div class="flex flex-wrap items-center justify-between gap-2">
					<div class="flex flex-wrap items-center gap-2">
						<img alt="" class="hidden w-10 h-10 rounded-lg object-cover border border-zinc-700" data-field="itemImgUrl" data-show-if="hasItemImage" />
						<input class="rounded bg-zinc-900 border-zinc-700 text-amber-500" data-action="toggleItemEquipped" data-field="equipped" data-i18n-title="pc.equippedTitle" type="checkbox" />
						<span class="font-bold text-sm text-white" data-field="name"></span>
						<span class="text-xs text-amber-400">x<span data-field="count"></span></span>
						<span class="px-2 py-0.5 rounded bg-zinc-800 text-sky-300 text-[10px]" data-field="containerBadge"></span>
						<span class="px-2 py-0.5 rounded bg-zinc-800 text-zinc-300 text-[10px]" data-field="rarity"></span>
						<span class="px-1.5 py-0.5 rounded bg-zinc-900 text-zinc-500 text-[10px]" data-field="sourceBadge"></span>
					</div>
					<button class="text-xs text-rose-400 hover:underline" data-action="removeListItem" data-i18n="common.remove" data-list-type="items" type="button"></button>
				</div>
				<div class="flex gap-3 text-xs text-amber-300 font-medium">
					<span data-field="damage"></span>
					<span data-field="ac"></span>
				</div>
				<p class="text-xs text-zinc-400 leading-relaxed whitespace-pre-line" data-field="description"></p>
			</div>
		</template>

		<template id="tpl-feat-row">
			<div class="rounded-xl border border-zinc-800 bg-zinc-950/60 p-3 space-y-1">
				<div class="flex items-center justify-between gap-2">
					<div class="flex flex-wrap items-center gap-2">
						<span class="font-bold text-sm text-white" data-field="name"></span>
						<span class="px-2 py-0.5 rounded bg-amber-500/15 text-amber-300 text-[10px] font-semibold" data-field="originBadge"></span>
						<span class="px-1.5 py-0.5 rounded bg-zinc-800 text-zinc-400 text-[10px]" data-field="sourceBadge"></span>
					</div>
					<button class="text-xs text-rose-400 hover:underline" data-action="removeListItem" data-i18n="common.remove" data-list-type="feats" type="button"></button>
				</div>
				<p class="text-[11px] text-amber-400/80 italic" data-field="prerequisite"></p>
				<p class="text-xs text-zinc-300 leading-relaxed whitespace-pre-line" data-field="description"></p>
			</div>
		</template>

		<template id="tpl-companion-card">
			<div class="rounded-2xl border border-emerald-500/30 bg-zinc-950/80 p-4 space-y-3">
				<div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3 border-b border-zinc-800 pb-3">
					<div class="flex items-center gap-3">
						<img alt="" class="hidden w-16 h-16 rounded-xl object-cover border border-emerald-500/40" data-field="companionImgUrl" data-show-if="hasCompanionImage" />
						<div>
							<div class="flex items-center gap-2">
								<h4 class="text-base font-extrabold text-emerald-400" data-field="label"></h4>
								<span class="text-xs text-zinc-400">(<span data-field="name"></span>)</span>
							</div>
							<p class="text-xs text-zinc-400" data-field="typeAndSize"></p>
							<p class="text-xs text-zinc-300 mt-0.5">
								<span data-i18n="pc.acLabel"></span> <strong class="text-sky-400" data-field="ac"></strong> &bull;
								<span data-i18n="pc.speedLabel"></span> <strong data-field="speed"></strong>
							</p>
						</div>
					</div>
					<div class="flex items-center gap-2 bg-zinc-900 border border-zinc-800 px-3 py-1.5 rounded-xl text-xs">
						<span class="text-rose-400 font-bold">HP:</span>
						<input class="w-14 bg-zinc-950 border border-zinc-700 rounded px-1.5 py-0.5 text-center font-extrabold text-emerald-400" data-action="updateCompanionHp" data-field="hpCurrent" type="number" />
						<span class="text-zinc-400">/ <strong data-field="hpMax"></strong></span>
					</div>
				</div>
				<div class="text-xs font-mono text-amber-300 bg-zinc-900/90 px-3 py-1.5 rounded-lg" data-field="abilitiesLine"></div>
				<div class="text-xs text-zinc-300 space-y-1">
					<div><strong data-i18n="pc.savesAndSkillsLabel"></strong> <span data-field="skillsAndSaves"></span></div>
					<div><strong data-i18n="pc.immunitiesLabel"></strong> <span data-field="immunities"></span></div>
					<div><strong data-i18n="pc.sensesLabel"></strong> <span data-field="senses"></span></div>
				</div>
				<p class="text-xs text-zinc-400 italic whitespace-pre-line" data-field="text"></p>
				<div class="space-y-1.5 text-xs text-zinc-200">
					<p class="whitespace-pre-line" data-field="traitsText"></p>
					<p class="whitespace-pre-line text-amber-200" data-field="actionsText"></p>
					<p class="whitespace-pre-line text-sky-200" data-field="reactionsText"></p>
				</div>
			</div>
		</template>

		<template id="tpl-shop-item-row">
			<div class="rounded-xl border border-zinc-800 bg-zinc-950/80 p-3.5 flex flex-col justify-between gap-2">
				<div>
					<div class="flex items-start justify-between gap-2">
						<span class="font-bold text-sm text-white" data-field="name"></span>
						<span class="px-2 py-0.5 rounded bg-amber-500/20 text-amber-300 text-xs font-bold whitespace-nowrap" data-field="priceLabel"></span>
					</div>
					<span class="block text-[11px] text-zinc-400 mt-0.5" data-field="stockLabel"></span>
					<p class="text-xs text-zinc-400 mt-2 line-clamp-3" data-field="description"></p>
				</div>
				<button class="w-full py-1.5 rounded-lg bg-amber-500 hover:bg-amber-400 text-zinc-950 text-xs font-bold" data-action="buyShopItem" data-i18n="pc.buyItemBtn" type="button"></button>
			</div>
		</template>

		<template id="tpl-compendium-result-row">
			<div class="rounded-xl border border-zinc-800 bg-zinc-950 p-2.5 flex items-center justify-between gap-2">
				<div>
					<div class="flex items-center gap-2">
						<span class="font-bold text-xs text-white" data-field="name"></span>
						<span class="px-1.5 py-0.5 rounded bg-zinc-800 text-[10px] text-amber-400 uppercase" data-field="category"></span>
						<span class="text-[10px] text-zinc-500" data-field="source"></span>
					</div>
					<p class="text-[11px] text-zinc-400" data-field="details"></p>
				</div>
				<button class="px-2.5 py-1 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold whitespace-nowrap" data-action="addCompendiumEntryToCharacter" data-i18n="common.add" type="button"></button>
			</div>
		</template>

		<template id="tpl-dice-log-row">
			<div class="rounded-xl border border-zinc-800 bg-zinc-950/90 p-2.5 text-xs flex items-center justify-between gap-2">
				<div>
					<div class="flex items-center gap-1.5">
						<strong class="text-amber-400" data-field="rollerName"></strong>
						<span class="text-zinc-500">&bull;</span>
						<span class="text-[10px] text-zinc-500" data-field="time"></span>
						<span class="px-1.5 py-0.5 rounded bg-emerald-500/20 text-emerald-300 text-[10px] font-bold" data-field="advantageBadge" data-show-if="hasAdvantageBadge"></span>
					</div>
					<div class="text-zinc-300 font-medium" data-field="rollLabel"></div>
					<div class="text-[11px] text-zinc-500"><span data-field="notation"></span> &rarr; <span data-field="rollsBreakdown"></span></div>
				</div>
				<div class="text-xl font-black text-white px-2.5 py-1 rounded-lg bg-zinc-900 border border-zinc-800" data-field="total"></div>
			</div>
		</template>

		<script src="./js/pc-app.js" type="module"></script>
	</body>
</html>
